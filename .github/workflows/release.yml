name: Release Builds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            name: windows-x86_64
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: macos-13
            name: macos-x86_64
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-14
            name: macos-aarch64
            target: aarch64-apple-darwin
            archive: tar.gz

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package release archive
        shell: bash
        run: |
          bin_name="cellular-automata"
          package_name="${bin_name}-${{ matrix.name }}"
          mkdir "$package_name"

          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            cp "target/${{ matrix.target }}/release/${bin_name}.exe" "$package_name/"
            7z a "${package_name}.zip" "./${package_name}/*"
            echo "ASSET_PATH=${package_name}.zip" >> "$GITHUB_ENV"
          else
            cp "target/${{ matrix.target }}/release/${bin_name}" "$package_name/"
            tar -czf "${package_name}.tar.gz" "$package_name"
            echo "ASSET_PATH=${package_name}.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: Upload workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: cellular-automata-${{ matrix.name }}
          path: ${{ env.ASSET_PATH }}
          if-no-files-found: error

      - name: Attach archives to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ env.ASSET_PATH }}
